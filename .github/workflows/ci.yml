name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pandas pytest

      - name: Generate sample data
        run: python -m astrolab.synth

      - name: Run I/O smoke test
        run: |
          python -c "from astrolab.io import load_frame_set; frames = load_frame_set(); assert len(frames) == 5"

      - name: Run pytest when tests exist
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        run: python -m pytest
